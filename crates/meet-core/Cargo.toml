[package]
name = "meet-core"
version = "0.0.0"
edition = "2021"
publish = false
description = "Núcleo do RenanMeet: captura, Opus, diarização, transcrição e ata"

[dependencies]
anyhow = "1"
unsafe-libopus = "0.2"
ogg = "0.9"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hound = "3.5"
libloading = "0.8"
nnnoiseless = { version = "0.5", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2.12", features = ["json"] }
sha2 = "0.10"
bzip2 = "0.5"
tar = "0.4"
symphonia = { version = "0.5", default-features = false, features = ["isomp4", "aac", "mp3", "flac"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[[bin]]
name = "meetcli"
path = "src/bin/meetcli.rs"

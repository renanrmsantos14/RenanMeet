[package]
name = "meet-app"
version = "0.0.0"
edition = "2021"
publish = false
description = "RenanMeet: aplicativo de desktop (Slint)"

[[bin]]
name = "renanmeet"
path = "src/main.rs"

[dependencies]
meet-core = { path = "../meet-core" }
anyhow = "1"
dirs = "5"
arboard = { version = "3", default-features = false }
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-systemfonts"] }
global-hotkey = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.27", default-features = false }

[build-dependencies]
slint-build = "1.19"
